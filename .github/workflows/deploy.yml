name: Deploy Astro Static Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Service Account File
        shell: bash
        env:
          B64_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$B64_KEY" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT_BASE64 secret is empty!"
            exit 1
          fi
          echo "$B64_KEY" | base64 --decode > serviceAccountKey.json
          echo "Restored serviceAccountKey.json successfully."

      - name: Sync GitHub Projects to Firestore
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          GITHUB_USERNAME: "GopalKholade"
        run: node scripts/sync-github.mjs

      - name: Build Astro static site
        env:
          SITE_URL: "https://gopalkholade.github.io"
          BASE_PATH: "/"
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4