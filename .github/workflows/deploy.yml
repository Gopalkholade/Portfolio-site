name: Deploy Astro Static Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Service Account File
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            let pk = process.env.PRIVATE_KEY || "";
            if (pk.startsWith("\"") && pk.endsWith("\"")) pk = pk.slice(1, -1);
            pk = pk.replace(/\\n/g, "\n");
            
            const sa = {
              type: "service_account",
              project_id: process.env.PROJECT_ID,
              client_email: process.env.CLIENT_EMAIL,
              private_key: pk
            };
            fs.writeFileSync("serviceAccountKey.json", JSON.stringify(sa, null, 2));
          '

      - name: Sync GitHub Projects to Firestore
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          GITHUB_USERNAME: "GopalKholade"
        run: node scripts/sync-github.mjs

      - name: Build Astro static site
        env:
          SITE_URL: "https://gopalkholade.github.io"
          BASE_PATH: "/"
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4